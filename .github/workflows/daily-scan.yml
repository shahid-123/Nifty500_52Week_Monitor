name: Daily Nifty 500 52-week scan

on:
  workflow_dispatch:
  schedule:
    # 11:15 UTC = 16:45 IST, Monday-Friday. Market holidays are harmless; latest data may be previous session.
    - cron: "15 11 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run daily scan
        run: python daily_scan.py
      - name: Commit updated scan outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily 52-week scan outputs"
          file_pattern: "data/latest_scan.csv"
